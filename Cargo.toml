[package]
name = "iradix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/al8n/iradix"
homepage = "https://github.com/al8n/iradix"
documentation = "https://docs.rs/iradix"
description = "A generic, persistent (copy-on-write) radix trie with structural sharing — bring-your-own-key, no_std + alloc, parameterized over Rc/Arc."
license = "MIT OR Apache-2.0"
categories = ["data-structures", "no-std", "concurrency"]
keywords = ["radix", "trie", "persistent", "immutable", "copy-on-write"]

[features]
default = ["std"]
# `event-listener?/std` is a weak feature: it turns on event-listener's blocking
# `wait()` only when the `watch` feature has already pulled the dependency in.
std = ["event-listener?/std"]
alloc = []
# Observe key/prefix changes across committed versions. Async `Watch::changed()`
# works on no_std + alloc; blocking `Watch::wait()` additionally needs `std`.
watch = ["dep:event-listener"]

[dependencies]
archery = { version = "1", default-features = false }
event-listener = { version = "5", optional = true, default-features = false }

[dev-dependencies]
arc-swap = "1"
proptest = "1"
pollster = "0.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[[example]]
name = "watch"
# The example blocks (`wait()`), spawns threads, and uses pollster — all std.
required-features = ["watch", "std"]
