[package]
name = "iradix"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/al8n/iradix"
homepage = "https://github.com/al8n/iradix"
documentation = "https://docs.rs/iradix"
description = "A generic, persistent (copy-on-write) radix trie with structural sharing — bring-your-own-key, no_std + alloc, parameterized over Rc/Arc."
license = "MIT OR Apache-2.0"
categories = ["data-structures", "no-std", "concurrency"]
keywords = ["radix", "trie", "persistent", "immutable", "copy-on-write"]

[features]
default = ["std"]
std = ["event-listener?/std"]
alloc = []
watch = ["dep:event-listener"]
future = ["dep:agnostic-lite", "watch"]
tokio = ["future", "agnostic-lite/tokio"]
smol = ["future", "agnostic-lite/smol"]
triomphe = ["dep:triomphe", "archery/triomphe"]

[dependencies]
archery = { version = "1", default-features = false }
event-listener = { version = "5", optional = true, default-features = false }
agnostic-lite = { version = "0.6", optional = true, default-features = false, features = [
  "time",
] }

triomphe = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
arc-swap = "1"
proptest = "1"
pollster = "0.4"
agnostic-lite = { version = "0.6", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }

# Benchmark harness and comparison targets (see `benches/comparison.rs`).
criterion = "0.8"
radix_trie = "0.3"
patricia_tree = "0.10"
qp-trie = "0.8"
im = "15"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[[bench]]
name = "comparison"
harness = false

[[example]]
name = "watch"
required-features = ["watch", "std"]

[[example]]
name = "watch_timeout"
required-features = ["tokio", "std"]
