[package]
name = "iradix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/al8n/iradix"
homepage = "https://github.com/al8n/iradix"
documentation = "https://docs.rs/iradix"
description = "A generic, persistent (copy-on-write) radix trie with structural sharing — bring-your-own-key, no_std + alloc, parameterized over Rc/Arc."
license = "MIT OR Apache-2.0"
categories = ["data-structures", "no-std", "concurrency"]
keywords = ["radix", "trie", "persistent", "immutable", "copy-on-write"]

[features]
default = ["std"]
# `std` and `alloc` are INDEPENDENT: `std` does not imply `alloc`. `archery`
# always provides the heap (`Rc`/`Arc`) and has no std/alloc feature of its own,
# so each tier only layers on its own lock backend.
std = ["dep:arc-swap"]
alloc = ["dep:spin"]
# `lockfree-nostd` is a no_std tier: it requires `alloc` so the `alloc`-as-`std`
# alias and the `spin` fallback backend are present (the `haphazard` lock-free
# backend is reserved; see `ConcurrentRadix`).
lockfree-nostd = ["alloc", "dep:haphazard"]

[dependencies]
archery = { version = "1", default-features = false }
arc-swap = { version = "1", optional = true }
spin = { version = "0.10", optional = true, default-features = false, features = [
  "rwlock",
] }
haphazard = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false
