[package]
name = "iradix"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/al8n/iradix"
homepage = "https://github.com/al8n/iradix"
documentation = "https://docs.rs/iradix"
description = "A generic, persistent (copy-on-write) radix trie with structural sharing — bring-your-own-key, no_std + alloc, parameterized over Rc/Arc."
license = "MIT OR Apache-2.0"
categories = ["data-structures", "no-std", "concurrency"]
keywords = ["radix", "trie", "persistent", "immutable", "copy-on-write"]

[features]
default = ["std"]
std = ["event-listener?/std"]
alloc = []
# Observe key/prefix changes across committed versions. Async `Watch::changed()`
# works on no_std + alloc; the blocking `Watch::block_wait*` additionally need `std`.
watch = ["dep:event-listener"]
# Runtime-agnostic async `Watch::changed_timeout::<R>()` via agnostic-lite's
# `RuntimeLite` (re-exported as `iradix::RuntimeLite`). Brings the trait only; name a
# runtime `R` from agnostic-lite itself. Works on no_std + alloc.
future = ["dep:agnostic-lite", "watch"]
tokio = ["future", "agnostic-lite/tokio"]
smol = ["future", "agnostic-lite/smol"]
# Back the `sync` face with triomphe's `Arc` (no weak count, more compact) instead of
# `std::sync::Arc`, via archery's `ArcTK`. Same public API; `no_std + alloc`. No direct
# triomphe dependency — iradix only names `archery::ArcTK`.
triomphe = ["archery/triomphe"]

[dependencies]
archery = { version = "1", default-features = false }
event-listener = { version = "5", optional = true, default-features = false }
agnostic-lite = { version = "0.6", optional = true, default-features = false, features = [
  "time",
] }

[dev-dependencies]
arc-swap = "1"
proptest = "1"
pollster = "0.4"
agnostic-lite = { version = "0.6", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[[example]]
name = "watch"
required-features = ["watch", "std"]

[[example]]
name = "watch_timeout"
required-features = ["tokio", "std"]
